<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>栞子 ミニライブテスト（コマ送り版）</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#32283b}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#faf3ff,#f2faff);overflow-x:hidden}
main{max-width:490px;margin:0 auto;padding:20px 17px 27px;display:flex;flex-direction:column;gap:13px}
h1{font-size:19px;line-height:1.3;margin:0;font-weight:800;color:#5f3664}
small{font-size:12px;color:#796b85}p{margin:0}
.header{display:flex;align-items:center;gap:10px}.header .note{flex:1}.tag{border-radius:20px;padding:6px 9px;background:#ecdef6;color:#835399;font-size:11px;font-weight:800}
.live-stage{height:280px;position:relative;overflow:hidden;border-radius:18px;background: radial-gradient(ellipse 130px 240px at 50% 18%,#fffae5 0%,#dfd4ff33 75%,transparent 100%),linear-gradient(160deg,#312d65 0%,#605285 45%,#6e4d99 100%);box-shadow:0 13px 24px #46337221;isolation:isolate}
.live-stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:48px;background:linear-gradient(to bottom,#604a85,#38305d);border-top:3px solid #d2b2de;box-shadow:0 -7px 20px #fae4ff55}
.light{position:absolute;top:-68px;width:125px;height:295px;transform-origin:top;opacity:.35;background:linear-gradient(to bottom,#fff7beaa,#ffffdd55 50%,transparent);clip-path:polygon(48% 0%,52% 0%,100% 100%,0% 100%)}
.light.left{left:15%;transform:rotate(-19deg);animation:lightL 4s ease-in-out infinite alternate}.light.right{right:15%;transform:rotate(19deg);animation:lightR 3.6s ease-in-out infinite alternate}
@keyframes lightL{to{transform:rotate(12deg)}}@keyframes lightR{to{transform:rotate(-12deg)}}
.stage-title{position:absolute;top:17px;left:0;right:0;font-size:12px;letter-spacing:.16em;text-align:center;color:#fff8dc;font-weight:800;text-shadow:0 2px 5px #1a0939}
.stage-stars{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 13% 19%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 81% 33%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 26% 61%,#ffff 0 1.5px,transparent 3px),radial-gradient(circle at 74% 13%,#ffff 0 2px,transparent 3px)}
.sprite-wrap{position:absolute;bottom:51px;left:50%;height:110px;width:160px;display:grid;place-items:end center;transform:translateX(-50%);z-index:2}
#sprite{height:var(--sprite-height,88px);width:auto;max-width:none;display:block;object-fit:contain;filter:drop-shadow(0 5px 3px #130e3060);transition:height .1s ease;image-rendering:auto}
.shadow{position:absolute;width:105px;height:13px;background:#10092870;filter:blur(6px);border-radius:50%;left:50%;bottom:42px;transform:translateX(-50%);z-index:1}
.stage-foot{position:absolute;bottom:12px;width:100%;text-align:center;z-index:2;color:#f2dfefaa;font-size:10px;letter-spacing:.06em}
.panel{background:white;border:1px solid #ece3ef;border-radius:15px;padding:13px 14px;box-shadow:0 3px 12px #52365b0d}
.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button,select{font:inherit;border-radius:11px;min-height:42px;padding:9px 12px;touch-action:manipulation}
button{cursor:pointer;border:1px solid #d8b0db;background:#fff;color:#663c6f;font-weight:750}
button.primary{background:#b34e99;border-color:#b34e99;color:#fff;min-width:125px}
button:focus-visible,select:focus-visible{outline:3px solid #49b7cb;outline-offset:2px}
label{font-size:12px;color:#66586b;display:flex;align-items:center;gap:5px;font-weight:650}select{background:#fff;border:1px solid #e0cfe5;font-size:13px;padding:6px}
.caption{font-size:12px;line-height:1.65;color:#776c80}
.status{font-size:12px;font-weight:700;color:#704b85}
@media (max-width:360px){main{padding:15px 11px}button,select{padding:8px 9px}.live-stage{height:255px}}
@media (prefers-reduced-motion:reduce){.light.left,.light.right{animation:none}}
</style></head><body>
<main><div class="header"><div class="note"><h1>栞子・ミニライブ</h1><small>「決意の光」衣装 ／ 6ポーズ・コマ送り版</small></div><span class="tag">TEST</span></div>
