<head>
<meta charset="utf-8">

<title>栞子｜ミニライブ動作テスト</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf8f4,#f3effe);color:#283740}
header{text-align:center;padding:17px 16px 8px}h1{font-size:20px;margin:0 0 7px}header p{font-size:12px;color:#567;margin:0}
.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-width:700px;margin:12px auto;padding:0 12px}
button{border-radius:30px;border:1px solid #aecdc0;background:white;padding:9px 16px;font-size:13px;color:#153d32;font-weight:700;cursor:pointer;min-height:40px}
button[aria-pressed="true"]{background:#176858;color:white;border-color:#176858}label{display:flex;gap:6px;align-items:center;font-size:12px}input{accent-color:#187663;max-width:120px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:860px;gap:14px;margin:10px auto;padding:0 12px}
.panel{min-width:0;overflow:hidden;border:1px solid #c6dfd8;border-radius:20px;background:#fff;box-shadow:0 6px 20px #1547370d}
.panel h2{font-size:13px;text-align:center;margin:10px 0 0}.panel>p{font-size:11px;color:#64746f;text-align:center;margin:4px 6px 8px}
.stage{aspect-ratio:11/14;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#f7fffa 10%,#d0f3dd 46%,#88cbbb 100%)}
.stage:before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff15 0deg 10deg,#ffffff00 10deg 28deg);pointer-events:none}
.stage:after{content:"";position:absolute;left:4%;bottom:4%;width:92%;height:11%;border-radius:50%;background:#216a5422;filter:blur(10px)}
.figure{position:relative;width:94%;aspect-ratio:1145/1374;z-index:2;transform-origin:center 75%;overflow:visible}
.figure img{position:absolute;display:block;max-width:none;height:auto;user-select:none;pointer-events:none;-webkit-user-drag:none;transform-origin:var(--origin-x) var(--origin-y);will-change:transform;image-rendering:auto}
.figure.reference>img{width:100%;height:100%;top:0;left:0}.spark{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 15% 20%,#ffffffa0 0 3px,transparent 4px),radial-gradient(circle at 82% 30%,#ffffffa0 0 3px,transparent 4px),radial-gradient(circle at 65% 15%,#ffe3a9bb 0 4px,transparent 5px)}
.note{max-width:800px;padding:14px;margin:auto;font-size:12px;line-height:1.65;color:#45665b}
@media(max-width:600px){.main{gap:7px;padding:0 7px}.panel h2{font-size:12px}.stage{aspect-ratio:9/13}.figure{width:100%}button{padding:8px 12px}.controls{gap:5px}header{padding-top:12px}}
@media(prefers-reduced-motion:reduce){.figure,.figure img{transition:none!important}}
</style>

<script>
(()=>{
'use strict';
const root=document.getElementById('rig'),play=document.getElementById('play'),motion=document.getElementById('motion'),bpm=document.getElementById('bpm'),out=document.getElementById('bpmOut');
let playing=true,wide=false,beat=0,prev=0,layers=[];
try { const data=JSON.parse(document.getElementById('rig-data').textContent); {
 data.layers.forEach(part=>{
  const im=document.createElement('img');im.src=part.src;im.alt='';
  const [w,h]=data.referenceSize;
  im.style.left=(part.x/w*100)+'%';im.style.top=(part.y/h*100)+'%';
  im.style.width=(part.w/w*100)+'%';im.style.height=(part.h/h*100)+'%';
  im.style.setProperty('--origin-x',part.originX*100+'%');im.style.setProperty('--origin-y',part.originY*100+'%');
  root.append(im);layers.push({id:part.id,im});
 });
 requestAnimationFrame(frame);
}} catch(err){root.textContent='データ読込失敗: '+err.message;root.style.padding='30px'}
function frame(t){
 if(prev&&playing)beat+=Math.min(.05,(t-prev)/1000)*Number(bpm.value)/60*2*Math.PI;prev=t;
 const s=Math.sin(beat),v=Math.sin(beat/2),a=(wide?1.9:1);
 const poses={torso:[0,0,0],head:[1.15*s*a,-.15*s,0],arm_left:[1.7*s*a,0,0],arm_right:[-2.2*s*a,0,0],skirt:[.75*v*a,0,.35*s*a],leg_left:[-1.15*v*a,0,0],leg_right:[1.1*v*a,0,0]};
 for(const {id,im} of layers){const [rotate,dx,dy]=poses[id]||[0,0,0];im.style.transform=`translate(${dx}%,${dy}%) rotate(${rotate}deg)`}
 root.style.transform=`translateY(${-Math.abs(s)*(wide?0.8:0.35)}%) rotate(${.28*s*a}deg)`;
 requestAnimationFrame(frame);
}
play.addEventListener('click',()=>{playing=!playing;play.textContent=playing?'一時停止':'再生';play.setAttribute('aria-pressed',String(playing))});
motion.addEventListener('click',()=>{wide=!wide;motion.textContent=wide?'小さな動き':'大きめの動き';motion.setAttribute('aria-pressed',String(wide))});
bpm.addEventListener('input',()=>{out.textContent=bpm.value});
})();
</script>
