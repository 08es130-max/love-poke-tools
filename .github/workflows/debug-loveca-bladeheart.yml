name: Debug LoveCa blade heart fields

on:
  push:
    paths:
      - '.github/workflows/debug-loveca-bladeheart.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe official API filter values
        run: |
          python - <<'PY'
          import json, requests
          url='https://llofficial-cardgame.com/manage/card-list-user/list'
          headers={'User-Agent':'Mozilla/5.0 LovePokeTools/1.0','Accept':'application/json,text/plain,*/*','Referer':'https://llofficial-cardgame.com/cardlist/searchresults/'}
          candidates=['1','01','heart01','pink','桃','red','赤','green','緑','blue','青','purple','紫','all','ALL','draw','ドロー','music','note','音符','none','なし']
          out={}
          for value in candidates:
              params=[('page',1),('per_page',3),('sort','no'),('parallel','all'),('blade_heart[]',value)]
              r=requests.get(url,params=params,headers=headers,timeout=60)
              try:data=r.json()
              except Exception:
                  out[value]={'status':r.status_code,'body':r.text[:200]}; continue
              out[value]={'status':r.status_code,'total':data.get('total'),'query':data.get('query'),'cards':[x.get('card_number') for x in (data.get('items') or [])[:3]]}
          open('loveca-bladeheart-debug.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-bladeheart-debug.json
          git commit -m "Probe LoveCa blade heart filters" || exit 0
          git push
