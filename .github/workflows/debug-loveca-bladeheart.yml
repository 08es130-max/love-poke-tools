name: Debug LoveCa blade heart fields

on:
  push:
    paths:
      - '.github/workflows/debug-loveca-bladeheart.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect raw official API cards
        run: |
          python - <<'PY'
          import json, requests
          targets={'PL!-sd1-022-SD','PL!N-bp7-025-L','PL!N-bp7-020-N','PL!N-bp4-025-L'}
          found={}
          url='https://llofficial-cardgame.com/manage/card-list-user/list'
          headers={'User-Agent':'Mozilla/5.0 LovePokeTools/1.0','Accept':'application/json,text/plain,*/*','Referer':'https://llofficial-cardgame.com/cardlist/searchresults/'}
          for page in range(1,40):
              r=requests.get(url,params={'page':page,'per_page':100,'sort':'no','parallel':'all'},headers=headers,timeout=60)
              r.raise_for_status()
              data=r.json()
              items=data.get('items') or []
              for item in items:
                  no=str(item.get('card_number') or '')
                  if no in targets:
                      found[no]=item
              if targets.issubset(found) or len(items)<100: break
          open('loveca-bladeheart-debug.json','w',encoding='utf-8').write(json.dumps(found,ensure_ascii=False,indent=2))
          PY
      - name: Commit debug output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-bladeheart-debug.json
          git commit -m "Capture raw LoveCa live fields" || exit 0
          git push
