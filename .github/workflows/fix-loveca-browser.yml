name: Fix LoveCa card browser

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_loveca_browser.py'
      - '.github/workflows/fix-loveca-browser.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe browser patch
        run: python scripts/fix_loveca_browser.py
      - name: Commit fix
        run: |
          if git diff --quiet -- loveca-card-browser.js; then
            echo "No browser changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js
          git commit -m "Fix LoveCa card browser filters and favorites"
          git push
