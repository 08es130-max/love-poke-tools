name: Apply LoveCa advanced filters

on:
  push:
    paths:
      - 'scripts/add_loveca_advanced_filters.py'
      - '.github/workflows/apply-loveca-advanced-filters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/add_loveca_advanced_filters.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js loveca-card-browser.css sw.js
          git commit -m "Add LoveCa advanced search filters"
          git push
