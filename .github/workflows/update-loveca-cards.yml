name: Update LoveCa card database

on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * 1'
  push:
    paths:
      - 'scripts/update_loveca_cards.py'
      - '.github/workflows/update-loveca-cards.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Capture official cardlist scripts for debugging
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          page='https://llofficial-cardgame.com/cardlist/searchresults/?expansion=&view=text'
          headers={'User-Agent':'Mozilla/5.0 LovePokeTools/1.0'}
          html=requests.get(page,headers=headers,timeout=45).text
          pathlib.Path('loveca-debug-scripts').mkdir(exist_ok=True)
          soup=BeautifulSoup(html,'html.parser')
          for i,tag in enumerate(soup.find_all('script',src=True)):
              url=urljoin(page,tag['src'])
              if 'cardlist' not in url and 'card-manager' not in url:
                  continue
              try:
                  r=requests.get(url,headers=headers,timeout=45)
                  print(r.status_code,url)
                  name=f'{i:02d}-'+url.split('/')[-1].split('?')[0]
                  pathlib.Path('loveca-debug-scripts',name).write_bytes(r.content)
              except Exception as exc:
                  print('ERR',url,exc)
          PY
      - name: Build card database
        run: python scripts/update_loveca_cards.py
      - name: Upload debug files if parsing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loveca-cardlist-debug
          path: |
            loveca-cardlist-debug.html
            loveca-debug-scripts/
          if-no-files-found: ignore
      - name: Commit database update
        run: |
          if git diff --quiet -- loveca-cards.json; then
            echo "No database changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-cards.json
          git commit -m "Update LoveCa card database"
          git push
