name: Apply LoveCa multi-color filters

on:
  push:
    paths:
      - 'scripts/patch_loveca_multifilters.py'
      - '.github/workflows/apply-loveca-multifilters-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_loveca_multifilters.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js loveca-filter-selector.js loveca-card-browser.css scripts/update_loveca_cards.py sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add multi-color heart and blade filters"
          git push
