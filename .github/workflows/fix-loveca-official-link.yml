name: Fix LoveCa official link

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fix_loveca_official_link.py'
      - '.github/workflows/fix-loveca-official-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        run: python scripts/fix_loveca_official_link.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js sw.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix LoveCa official card link"
            git push
          fi
