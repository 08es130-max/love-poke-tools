name: Apply LoveCa blade heart semantics v2

on:
  push:
    paths:
      - 'scripts/fix_loveca_bladeheart_semantics.py'
      - '.github/workflows/apply-loveca-bladeheart-semantics-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        run: python scripts/fix_loveca_bladeheart_semantics.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js loveca-filter-selector.js sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fix LoveCa blade heart filtering"
          git push
