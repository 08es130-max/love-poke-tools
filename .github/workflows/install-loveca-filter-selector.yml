name: Install compact LoveCa filter selector

on:
  push:
    paths:
      - 'scripts/install_loveca_filter_selector.py'
      - '.github/workflows/install-loveca-filter-selector.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact filter selector
        run: python scripts/install_loveca_filter_selector.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loveca-card-browser.js loveca-card-browser.css loveca-filter-selector.js index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add compact LoveCa filter picker and work filter"
          git push
