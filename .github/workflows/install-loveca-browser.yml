name: Install LoveCa card browser

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/install_loveca_browser.py'
      - '.github/workflows/install-loveca-browser.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current PWA files safely
        run: python scripts/install_loveca_browser.py
      - name: Commit installation
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "No installation changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Install LoveCa card browser"
          git push
